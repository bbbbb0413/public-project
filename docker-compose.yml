services:
  db:
    container_name: db
    platform: linux/x86_64
    image: mysql:8.0.23
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_MAX_CONNECTIONS: 5000
      DB_USER: ${DB_USER}
      DB_USER_PW: ${DB_USER_PW}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./public-server/docker/init-db/init-db.sh:/init-db.sh
    entrypoint: ["/bin/bash", "/init-db.sh"]
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_REPLICATION_MODE=master
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongo
    hostname: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  kafka:
    container_name: kafka
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  # ai-service-python-migration-plan.md §2.5 — 잡 큐 토픽 프로비저닝 (1회 실행 후 종료)
  kafka-init:
    container_name: kafka-init
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in ai.rag.ask.requested ai.rag.ask.completed ai.rag.ask.dlq ai.knowledge.ingest.requested ai.knowledge.ingest.completed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  identity:
    container_name: identity
    platform: linux/x86_64
    build:
      context: ./public-server
      args:
        APP_NAME: identity
    command: node dist/apps/identity/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_PORT: 18080
      PORT: 18080
      IDENTITY_GRPC_URL: "0.0.0.0:50051"
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      CHAT_REDIS_HOST: redis
      CHAT_REDIS_PORT: 6379
      CHAT_REDIS_DB_NUMBER: 2
      PERSONAL_DB_HOST: db
      PERSONAL_DB_PORT: 3306
      PERSONAL_DB_USER_NAME: ${DB_USER}
      PERSONAL_DB_USER_PW: ${DB_USER_PW}
      PERSONAL_DB_NAME: personal
      PERSONAL_DB_SYNCHRONIZE: "true"
      GAME_DB_HOST: db
      GAME_DB_PORT: 3306
      GAME_DB_USER_NAME: ${DB_USER}
      GAME_DB_USER_PW: ${DB_USER_PW}
      GAME_DB_NAME: game
      GAME_DB_SYNCHRONIZE: "true"
      MONGODB_ATLAS_URI: mongodb://mongo:27017
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5175}
    ports:
      - "18080:18080"
    depends_on:
      - db
      - redis
      - mongo
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  payment:
    container_name: payment
    platform: linux/x86_64
    build:
      context: ./public-server
      args:
        APP_NAME: payment
    command: node dist/apps/payment/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_PORT: 18081
      PORT: 18081
      PAYMENT_GRPC_URL: "0.0.0.0:50052"
      KAFKA_BROKERS: kafka:29092
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      CHAT_REDIS_HOST: redis
      CHAT_REDIS_PORT: 6379
      CHAT_REDIS_DB_NUMBER: 2
      PERSONAL_DB_HOST: db
      PERSONAL_DB_PORT: 3306
      PERSONAL_DB_USER_NAME: ${DB_USER}
      PERSONAL_DB_USER_PW: ${DB_USER_PW}
      PERSONAL_DB_NAME: personal
      PERSONAL_DB_SYNCHRONIZE: "true"
      GAME_DB_HOST: db
      GAME_DB_PORT: 3306
      GAME_DB_USER_NAME: ${DB_USER}
      GAME_DB_USER_PW: ${DB_USER_PW}
      GAME_DB_NAME: game
      GAME_DB_SYNCHRONIZE: "true"
      PAYMENT_DB_HOST: db
      PAYMENT_DB_PORT: 3306
      PAYMENT_DB_USER_NAME: ${DB_USER}
      PAYMENT_DB_USER_PW: ${DB_USER_PW}
      PAYMENT_DB_NAME: payment
      PAYMENT_DB_SYNCHRONIZE: "true"
      DB_CONNECTION_LIMIT: "50"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5175}
    ports:
      - "18081:18081"
    depends_on:
      - db
      - redis
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  chat-service:
    container_name: chat-service
    platform: linux/x86_64
    build:
      context: ./public-server
      args:
        APP_NAME: chat-service
    command: node dist/apps/chat-service/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CHAT_GRPC_URL: "0.0.0.0:50053"
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      CHAT_REDIS_HOST: redis
      CHAT_REDIS_PORT: 6379
      CHAT_REDIS_DB_NUMBER: 2
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # 회원가입 시 identity가 발행하는 'mail' 큐를 구독해서 실제 메일 발송(gRPC SendMail 호출)을 처리한다.
  admin-server:
    container_name: admin-server
    platform: linux/x86_64
    build:
      context: ./public-server
      args:
        APP_NAME: admin-server
    command: node dist/apps/admin-server/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_GRPC_URL: "0.0.0.0:50054"
      IDENTITY_GRPC_URL: "identity:50051"
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      PERSONAL_DB_HOST: db
      PERSONAL_DB_PORT: 3306
      PERSONAL_DB_USER_NAME: ${DB_USER}
      PERSONAL_DB_USER_PW: ${DB_USER_PW}
      PERSONAL_DB_NAME: personal
      PERSONAL_DB_SYNCHRONIZE: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      - db
      - redis
      - identity
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  gateway:
    container_name: gateway
    platform: linux/x86_64
    build:
      context: ./public-server
      args:
        APP_NAME: gateway
    command: node dist/apps/gateway/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_PORT: 3000
      PORT: 3000
      IDENTITY_GRPC_URL: "identity:50051"
      PAYMENT_GRPC_URL: "payment:50052"
      CHAT_GRPC_URL: "chat-service:50053"
      AUTH_GRPC_URL: "admin-server:50054"
      KAFKA_BROKERS: kafka:29092
      AI_SERVICE_PY_URL: http://ai-service-py:3004
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      CHAT_REDIS_HOST: redis
      CHAT_REDIS_PORT: 6379
      CHAT_REDIS_DB_NUMBER: 2
      PERSONAL_DB_HOST: db
      PERSONAL_DB_PORT: 3306
      PERSONAL_DB_USER_NAME: ${DB_USER}
      PERSONAL_DB_USER_PW: ${DB_USER_PW}
      PERSONAL_DB_NAME: personal
      PERSONAL_DB_SYNCHRONIZE: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5175}
    ports:
      - "3000:3000"
    depends_on:
      identity:
        condition: service_started
      payment:
        condition: service_started
      chat-service:
        condition: service_started
      admin-server:
        condition: service_started
      kafka:
        condition: service_healthy
      ai-service-py:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # 구버전 NestJS ai-service(v1)는 폐기. Gateway가 Kafka/HTTP로 ai-service-py에 직접 프록시한다.
  ai-service-py:
    container_name: ai-service-py
    build:
      context: ./public-python-server
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_PORT: 3004

      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4:14b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-${OLLAMA_MODEL:-phi4:14b}}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_EMBEDDING_MODEL: ${GOOGLE_EMBEDDING_MODEL:-gemini-embedding-001}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}

      # qwen3-embedding:4b(OLLAMA_EMBEDDING_MODEL) 출력 차원. Qdrant 컬렉션/시맨틱 캐시 벡터 크기와 반드시 일치해야 함.
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-2560}

      REDIS_DB_HOST: redis
      REDIS_DB_PORT: 6379
      MONGODB_VECTOR_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_DB_NAME: ai_service
      KAFKA_BROKERS: kafka:29092
      QDRANT_URL: http://qdrant:6333
    ports:
      - "3005:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  frontend:
    container_name: frontend
    build:
      context: ./public-front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_IDENTITY_API_BASE_URL: ${VITE_IDENTITY_API_BASE_URL:-http://localhost:18080}
    ports:
      - "5175:5175"
    depends_on:
      - gateway
      - identity
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  mongo_configdb:
  kafka_data:
  qdrant_data:
