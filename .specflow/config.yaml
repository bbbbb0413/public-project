# SpecFlow 설정 — public-project
#
# specflow init 이 프로젝트를 훑어 만든 초안입니다.
# TODO 가 붙은 곳은 반드시 확인하세요. 나머지도 한 번 훑어보는 편이 좋습니다.
#
# 이 파일은 엔진 repo 에 커밋하지 않습니다. 이 머신·이 프로젝트에만
# 의미가 있고, 잃어버려도 specflow init 으로 다시 만들 수 있습니다.
#
# 형식: ~/.specflow/SCHEMA.md · 예시: ~/.specflow/examples/

version: 1

specs:
  dir: docs/specs

git:
  branch_pattern: "feat/{spec_id}-{slug}"
  commit_pattern: "{type}: {title} ({spec_id})"
  base_branch: main
  push: true
  # P8 리허설로 결과 품질을 확인한 뒤 draft 로 올렸습니다 (2026-08-19).
  # 머지는 항상 사람이 합니다. 되돌리려면 none 으로 바꾸세요 —
  # none 이면 원격에 아무것도 올리지 않습니다.
  pr: draft

targets:
  front:
    path: public-front
    repo: true
    remote: origin
    # 저장소 전체 게이트는 손대기 전부터 실패합니다 (eslint 23건).
    # 이 리허설이 건드리는 src/utils 만 검사하도록 좁혔습니다.
    # 경로가 아직 없어도 통과해야 하므로 unmatched 를 오류로 보지 않습니다.
    gates:
      lint: "npx eslint --no-error-on-unmatched-pattern \"src/utils/**/*.{ts,tsx}\""
      build: "npm run build"
      test: "npx vitest run src/utils --passWithNoTests"

  python-server:
    path: public-python-server
    repo: true
    remote: origin
    gates:
      lint: ".venv/bin/ruff check src tests"
      type: ".venv/bin/mypy src"
      test: ".venv/bin/pytest -m 'not integration'"

  server:
    path: public-server
    repo: true
    remote: origin
    # pnpm lint 는 eslint --fix 라 파일을 고치고, 전체 테스트는 자동 생성 코드에서
    # 손대기 전부터 실패합니다. 리허설 범위인 libs/common/src/utils 로 좁혔습니다.
    #
    # jest 설정 중 libs/** 를 잡는 것이 하나도 없어(모두 apps/<name>/src 기준)
    # --testMatch 로 덮어써야 이 경로의 테스트가 실제로 돌아갑니다.
    gates:
      lint: "npx eslint --no-error-on-unmatched-pattern \"libs/common/src/utils/*.ts\""
      build: "pnpm build"
      test: "npx jest --config apps/gateway/jest-unit.json --testMatch \"**/libs/common/src/utils/**/*.spec.ts\" --passWithNoTests"
    # spec 이 건드린 앱만 골라 돌린다. test:all 은 5개 스위트를 순차 실행해 느리다.
    scoped_test:
      apps/ai-service: "pnpm test:ai"
      apps/chat-service: "pnpm test:chat"
      apps/gateway: "pnpm test:gateway"
      apps/identity: "pnpm test:identity"
      apps/payment: "pnpm test:payment"

agent:
  # Antigravity 를 주력으로 쓴다. 스테이지·타깃별로 아래 overrides 에서 바꾼다.
  default: agy

  commands:
    # agy 는 claude 와 호출 규약이 다르다.
    #   · 프롬프트를 -p 의 값으로 받는다 (stdin 파이프 불가)
    #   · --add-dir 가 없으면 "생성했습니다" 라고 답하고 아무것도 안 만든다
    #   · --print-timeout 기본값이 5분이라 스테이지 제한에 맞춰 올려야 한다
    agy:
      command: "agy --dangerously-skip-permissions --add-dir {cwd} --print-timeout {timeout} -p {prompt}"
      prompt_via: arg

    claude:
      command: "claude -p --permission-mode acceptEdits --allowedTools \"Read,Write,Edit,Glob,Grep,Bash\""
      prompt_via: stdin

  # 스테이지 또는 스테이지.타깃 단위로 다른 에이전트를 지정한다.
  # overrides:
  #   qa: claude
  #   backend.server: claude

stages:
  - name: backend
    targets: [python-server, server]
    prompt: backend

  - name: frontend
    targets: [front]
    prompt: frontend

  - name: qa
    targets: [front, python-server, server]
    prompt: qa
    requires_infra: false

infra:
  up: "docker compose up -d"
  down: "docker compose down"
  health: "docker compose ps --format json"
  wait_timeout: 180

repair:
  max_attempts: 3
  log_tail_lines: 200

limits:
  stage_timeout_minutes: 30
  run_timeout_minutes: 120
  # 하룻밤에 처리할 spec 개수. 1 로 둔다.
  #
  # spec 들은 _cli_run.py 의 루프로 차례로 돌지만 **사이에 머지가 없다.**
  # 각자 같은 로컬 base_branch 에서 갈라지므로, 같은 파일을 건드리는 spec 이
  # 섞이면 나중 PR 이 충돌한다. SPEC-005/006/007 이 그렇게 됐다.
  #
  # 늘리려면 그 전에 spec 사이에 머지가 들어가야 한다. 그때까지는
  # 실행 → 검증 → 머지 → 다음 실행 순서를 지키는 것이 1 의 뜻이다.
  max_specs_per_run: 1
  max_plans_per_run: 1
  # 검토되지 않은 draft 가 이만큼 쌓이면 기획을 건너뛴다.
  max_draft_specs: 5

retention:
  runs_keep_days: 14
  # 나이와 무관하게 최근 10개는 남긴다.
  runs_keep_min: 10
  # 실패한 run 은 더 오래. 되돌아가 읽는 것은 대개 이쪽이다.
  failed_keep_days: 30
  rejected_keep_days: 30
  log_max_bytes: 5242880
  log_keep_generations: 1

